<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Finance DEV</title>
  <style>
    body { font-family: system-ui, Arial; margin: 40px; max-width: 820px; }
    code { background: #f2f2f2; padding: 2px 6px; border-radius: 6px; }
    .ok { display:inline-block; padding:6px 10px; border-radius:999px; background:#e8fff1; }
    .err { display:inline-block; padding:6px 10px; border-radius:999px; background:#ffe8e8; }
    button { padding: 10px 14px; border-radius: 10px; border: 1px solid #ccc; cursor: pointer; }
    pre { background:#0b1020; color:#e6e6e6; padding:14px; border-radius:12px; overflow:auto; }
    .row { display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  </style>
</head>
<body>
  <h1>Finance App — DEV</h1>
  <div class="row">
    <span class="ok">Frontend online ✅</span>
    <span id="apiStatus">API: (não testada)</span>
  </div>

  <p>Endpoints:</p>
  <ul>
    <li>Front: <code>https://finance-dev.gardenwjs.tech</code></li>
    <li>API Health: <code>https://api-finance-dev.gardenwjs.tech/health</code></li>
  </ul>

  <div class="row">
    <button id="btn">Testar API agora</button>
  </div>

  <h3>Resposta</h3>
  <pre id="out">Clique em "Testar API agora".</pre>

  <script>
    const out = document.getElementById('out');
    const apiStatus = document.getElementById('apiStatus');

    async function testApi() {
      out.textContent = 'Carregando...';
      apiStatus.textContent = 'API: testando...';
      try {
        const r = await fetch('https://api-finance-dev.gardenwjs.tech/health');
        const j = await r.json();
        apiStatus.innerHTML = '<span class="ok">API online ✅</span>';
        out.textContent = JSON.stringify({ httpStatus: r.status, body: j }, null, 2);
      } catch (e) {
        apiStatus.innerHTML = '<span class="err">API com erro ❌</span>';
        out.textContent = String(e);
      }
    }

    document.getElementById('btn').addEventListener('click', testApi);
  </script>
</body>
</html>
